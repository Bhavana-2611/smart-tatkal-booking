<!DOCTYPE html>
<html>
<head>
    <title>Login Success</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #004080, #0073e6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }

        .box {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 40px;
            border-radius: 10px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: yellow;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: orange;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>🎉 Login Successful!</h1>
        <p>Welcome to Smart Tatkal Booking System 🚆</p>
        <br>
        <button class="btn">Continue to Booking</button>
    </div>

</body>
</html>
